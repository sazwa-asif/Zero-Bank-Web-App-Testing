[pytest]
# addopts = additional option
# (-ra) print a summary of non-passing results.
addopts =
    --base-url http://zero.webappsecurity.com
    --video on
    --screenshot on
    --output test-results
    --html report/report.html
    --self-contained-html
    -ra
testpaths = tests
markers =
    planted_bug: an intentionally failing test that demonstrates the suite catches bugs
